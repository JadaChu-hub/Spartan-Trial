<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📒 GRE (Unit 2)</title>
    <style>
       body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #FFFDE7; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; color: #3E2723; padding-top: 15px; position: relative;}
        h1 { color: #F57F17; margin-bottom: 10px; font-size: 22px; text-align: center; font-weight: 800;}
        .lang-toggle-btn { position: absolute; top: 10px; right: 10px; background-color: #ffffff; color: #F57F17; border: 2px solid #F57F17; padding: 4px 10px; border-radius: 15px; font-size: 12px; font-weight: bold; cursor: pointer; z-index: 100;}
        .tabs { display: flex; gap: 6px; margin-bottom: 15px; flex-wrap: wrap; justify-content: center; width: 95%;}
        .tab-btn { padding: 8px 10px; font-size: 14px; border: none; border-radius: 8px; background-color: #FFE082; color: #E65100; cursor: pointer; font-weight: bold; transition: 0.3s;}
        .tab-btn.active { background-color: #E65100; color: white; }
        .view-section { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 380px; }
        .view-section.active { display: flex; }
        .card-container { width: 90vw; max-width: 350px; height: 340px; perspective: 1000px; margin-bottom: 15px; cursor: pointer; }
        .card { width: 100%; height: 100%; position: relative; transition: transform 0.6s; transform-style: preserve-3d; box-shadow: 0 10px 20px rgba(245, 127, 23, 0.1); border-radius: 15px; }
        .card.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 15px; padding: 20px; box-sizing: border-box; text-align: center; overflow-y: auto; }
        .card-front { background-color: #ffffff; color: #F57F17; border: 2px solid #FFF59D; backface-visibility: hidden;}
        .word-text { font-size: 30px; font-weight: bold; margin-bottom: 10px;}
        .eng-def { font-size: 15px; color: #BF360C; font-style: italic; padding: 0 10px; line-height: 1.3;}
        .card-back { background-color: #FFF59D; color: #3E2723; transform: rotateY(180deg); align-items: flex-start; text-align: left; backface-visibility: hidden;}
        .translation { font-size: 17px; font-weight: bold; margin-bottom: 8px; color: #BF360C; border-bottom: 1px solid #c8a415; padding-bottom: 4px; width: 100%;}
        .details { font-size: 13px; margin-bottom: 6px; line-height: 1.3; }
        .details strong { color: #E65100; }
        .example { font-size: 13px; font-style: italic; margin-top: 6px; padding-top: 6px; border-top: 1px dashed #795548; color: #4E342E; }
        .front-tools { display: flex; gap: 20px; margin-top: 15px; align-items: center;}
        .tool-btn { background: none; border: none; font-size: 24px; cursor: pointer; padding: 0; transition: 0.2s;}
        .star-btn { color: #DDDDDD; }
        .star-btn.active { color: #E65100; transform: scale(1.2); }
        .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        button.action-btn { padding: 8px 12px; font-size: 14px; border: none; border-radius: 8px; background-color: #F57F17; color: white; cursor: pointer; transition: 0.2s; }
        button.action-btn:hover { background-color: #E65100; }
        button.action-btn.green-btn { background-color: #FFB300; }
        .counter { margin-top: 10px; font-size: 13px; color: #795548; font-weight: bold;}
        .mastery-text { font-size: 14px; color: #BF360C; font-weight: bold; margin-bottom: 15px; background: #FFE082; padding: 8px 12px; border-radius: 12px; text-align: center; width: 90%;}
        .quiz-question { font-size: 16px; font-weight: bold; color: #BF360C; text-align: center; margin-bottom: 15px; padding: 0 15px; line-height: 1.4;}
        .quiz-options { width: 100%; display: flex; flex-direction: column; gap: 8px; padding: 0 20px; box-sizing: border-box;}
        .quiz-option { padding: 12px; background-color: #ffffff; color: #F57F17; border: 2px solid #F57F17; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; text-align: center; transition: 0.2s; }
        .feedback { margin-top: 12px; font-weight: bold; font-size: 16px; min-height: 22px; text-align: center;}
        .progress-container { width: 90%; background-color: #FFE082; border-radius: 10px; margin: 5px auto 15px auto; overflow: hidden; height: 12px; }
        .progress-fill { width: 0%; height: 100%; background-color: #E65100; transition: width 0.5s; }
        .spell-answer-box { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; min-height: 45px; padding: 10px; border: 2px dashed #F57F17; border-radius: 10px; margin-bottom: 15px; width: 90%; background-color: #ffffff; }
        .letter-pool { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 15px; width: 95%; }
        .letter-tile { background-color: #F57F17; color: white; border: none; border-radius: 6px; padding: 10px 14px; font-size: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 3px 0 #BF360C; user-select: none; }
        .letter-tile:active { transform: translateY(3px); box-shadow: 0 0 0 #BF360C; }
        .letter-tile.in-answer { background-color: #E65100; box-shadow: 0 3px 0 #A02B00; }
        .cloze-container { background: white; padding: 15px; border-radius: 12px; border: 2px solid #FFF59D; width: 90%; font-size: 15px; line-height: 1.8; color: #3E2723;}
        .cloze-select { padding: 2px 5px; font-size: 14px; color: #E65100; border: 1px solid #E65100; border-radius: 4px; font-weight: bold; background-color: #FFFDE7;}
        .grad-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 253, 231, 0.95); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px;}
        .grad-title { color: #F57F17; font-size: 26px; margin-bottom: 10px; }
        .grad-desc { color: #3E2723; font-size: 15px; line-height: 1.5; margin-bottom: 25px;}
        .grad-btn { width: 100%; max-width: 250px; background-color: #F57F17; color: white; font-size: 15px; font-weight: bold; padding: 12px 20px; border: none; border-radius: 30px; cursor: pointer; margin-bottom: 10px;}
        .grad-btn.stay-btn { background-color: #FFE082; color: #E65100; border: 1px solid #F57F17;}
    </style>
</head>
<body>
      
    <h1>📒 GRE (Unit 2)</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('flashcard')">📇 單詞卡</button>
        <button class="tab-btn" onclick="switchTab('quiz')">📝 隨機測驗</button>
        <button class="tab-btn" onclick="switchTab('spell')">🧩 字母拼圖</button>
        <button class="tab-btn" onclick="switchTab('cloze')">📖 實力總結</button>
    </div>

    <div id="flashcard-view" class="view-section active">
        <div class="card-container" onclick="flipCard()">
            <div class="card" id="flashcard">
                <div class="card-front">
                    <div class="word-text" id="wordText">Word</div>
                    <div class="eng-def" id="engDefText">Def...</div>
                    <div class="front-tools">
                        <button class="tool-btn" onclick="speakText('word', event)">🔊</button>
                        <button class="tool-btn star-btn" id="starBtn" onclick="toggleStar(event)">★</button>
                    </div>
                </div>
                <div class="card-back">
                    <div class="translation" id="translationText">解釋</div>
                    <div class="details" id="synAntText"><strong>同/反義：</strong><span>...</span></div>
                    <div class="details" id="usageText"><strong>固定用法：</strong><span>...</span></div>
                    <div class="example" id="exampleText">例句...</div>
                    <button class="action-btn" onclick="speakText('example', event)" style="margin-top: 10px; padding: 6px 12px; font-size: 12px; align-self: center;">🔊 朗讀例句</button>
                </div>
            </div>
        </div>
        <div class="controls">
            <button class="action-btn" onclick="prevCard()">⬅️ 上個</button>
            <button class="action-btn" onclick="flipCard()">🔄 翻面</button>
            <button class="action-btn" onclick="nextCard()">下個 ➡️</button>
            <button class="action-btn green-btn" onclick="shuffleCards()">🔀 洗牌</button>
        </div>
        <div class="counter" id="counterText">1 / ?</div>
    </div>

    <div id="quiz-view" class="view-section">
        <div class="mastery-text" id="masteryText">🏆 測驗熟練度：0% (0/0) <br> 🎖️ 證書進度：0 / 3</div>
        <div class="quiz-question" id="quizQuestion">
            <span style="font-size:13px; color:#486581;" id="quizHint">請選出對應答案：</span><br><br>
            <span id="quizDesc" style="font-size:18px;">...</span>
        </div>
        <div class="quiz-options" id="quizOptions"></div>
        <div class="feedback" id="quizFeedback"></div>
        <button class="action-btn" style="margin-top: 15px;" onclick="generateQuiz()">下一題</button>
    </div>

    <div id="spell-view" class="view-section">
        <div style="width: 100%;">
            <div class="mastery-text" id="spellProgressText" style="margin-bottom: 5px;">⌨️ 詞彙收集：0 / 25 (0%)</div>
            <div class="progress-container"><div class="progress-fill" id="spellProgressBar"></div></div>
        </div>
        <div class="quiz-question" style="font-size:14px; margin-bottom: 10px;" id="spellPrompt">解釋與例句</div>
        <div class="spell-answer-box" id="spellAnswerBox"></div>
        <div class="letter-pool" id="letterPool"></div>
        <button class="action-btn" id="submitSpellBtn" onclick="checkSpell()">送出答案</button>
        <div class="feedback" id="spellFeedback"></div>
        <button class="action-btn" style="margin-top: 15px; display: none;" id="nextSpellBtn" onclick="generateSpell()">下一題</button>
    </div>

    <div id="cloze-view" class="view-section">
        <div class="mastery-text">📖 單元主題實戰演練</div>
        <div class="cloze-container" id="clozeContainer"></div>
        <div class="feedback" id="clozeFeedback"></div>
        <button class="action-btn" style="margin-top: 15px;" onclick="checkCloze()">提交驗證</button>
    </div>

    <div class="grad-modal" id="gradModal">
        <h2 class="grad-title" id="gradTitle">🛡️ 結業！</h2>
        <p class="grad-desc" id="gradDesc">說明文字</p>
        <button class="grad-btn" onclick="window.location.href='index.html'">🎓 榮耀結業 (返回大廳)</button>
        <button class="grad-btn stay-btn" id="stayBtn" onclick="">📚 留下來繼續複習</button>
    </div>

    <script>
        
        // ==========================================
        // ⚠️ 修改區：存檔鍵名、生字資料、克漏字資料
        // ==========================================
        const STORAGE_KEY = 'spartan_gre_u2';
        
        let vocabData = [
    { word: "Aberrant", engDef: "Departing from an accepted standard or norm.", translation: "Adj. 異常的、脫軌的", synAnt: "同: abnormal / 反: typical", usage: "Aberrant behavior", example: "The researcher identified aberrant cell growth in the test sample." },
    { word: "Anomaly", engDef: "Something that deviates from what is normal or standard.", translation: "N. 異常事物", synAnt: "同: irregularity / 反: norm", usage: "Statistical anomaly", example: "Such a low score was an anomaly for the high-achieving student." },
    { word: "Inchoate", engDef: "Just begun and so not fully formed or developed.", translation: "Adj. 剛開始的、不成熟的", synAnt: "同: rudimentary / 反: mature", usage: "Inchoate ideas", example: "The lawyer's inchoate argument lacked sufficient supporting evidence." },
    { word: "Capricious", engDef: "Given to sudden and unaccountable changes of behavior.", translation: "Adj. 反復無常的", synAnt: "同: whimsical / 反: stable", usage: "Capricious weather", example: "The market is so capricious that investors are wary of long-term bets." },
    { word: "Erratic", engDef: "Not even or regular in pattern or movement.", translation: "Adj. 飄忽不定的", synAnt: "同: inconsistent / 反: predictable", usage: "Erratic pulse", example: "The car’s erratic movements suggested a potential steering failure." },
    { word: "Atypical", engDef: "Not representative of a type, group, or class.", translation: "Adj. 非典型的", synAnt: "同: unusual / 反: typical", usage: "Atypical response", example: "The warm breeze was atypical for a mid-winter afternoon in Moscow." },
    { word: "Divergent", engDef: "Tending to be different or develop differently.", translation: "Adj. 分歧的、相異的", synAnt: "同: differing / 反: convergent", usage: "Divergent views", example: "The two scientists took divergent paths in their research of dark matter." },
    { word: "Eccentric", engDef: "Unconventional and slightly strange in behavior.", translation: "Adj. 古怪的", synAnt: "同: idiosyncratic / 反: conventional", usage: "Eccentric billionaire", example: "The inventor was known for his eccentric habit of sleeping in his lab." },
    { word: "Idiosyncrasy", engDef: "A mode of behavior peculiar to an individual.", translation: "N. 癖好、特質", synAnt: "同: quirk, peculiarity / 反: normal", usage: "Personal idiosyncrasy", example: "Her habit of singing while studying was a helpful idiosyncrasy." },
    { word: "Irregular", engDef: "Not following the usual rules or customs.", translation: "Adj. 不規則的", synAnt: "同: anomalous / 反: regular", usage: "Irregular heartbeat", example: "The doctor was concerned about the patient's irregular heartbeat." },
    { word: "Oddity", engDef: "A strange or peculiar person, thing, or trait.", translation: "N. 怪人、怪事", synAnt: "同: anomaly / 反: normalcy", usage: "Biological oddity", example: "The rare blue lobster was considered a biological oddity by many." },
    { word: "Outlier", engDef: "A person or thing differing from other members.", translation: "N. 離群值、極端值", synAnt: "同: anomaly / 反: average", usage: "Data outlier", example: "The genius student was an outlier in his academically average class." },
    { word: "Peculiar", engDef: "Strange or odd; unusual; specific to.", translation: "Adj. 奇特的、特有的", synAnt: "同: distinctive / 反: ordinary", usage: "Peculiar smell", example: "The custom is peculiar to the mountain tribes of northern Asia." },
    { word: "Quaint", engDef: "Attractively unusual or old-fashioned in appearance.", translation: "Adj. 雅致的、古雅的", synAnt: "同: charming / 反: modern", usage: "Quaint village", example: "They spent their vacation in a quaint fishing village in France." },
    { word: "Singular", engDef: "Exceptionally good or great; unique; remarkable.", translation: "Adj. 非凡的、唯一的", synAnt: "同: extraordinary / 反: common", usage: "Singular focus", example: "She showed a singular devotion to her research on rare insects." },
    { word: "Unorthodox", engDef: "Contrary to what is usual, traditional, or accepted.", translation: "Adj. 非正統的、異端的", synAnt: "同: unconventional / 反: traditional", usage: "Unorthodox approach", example: "The coach used unorthodox training methods to improve performance." },
    { word: "Untypical", engDef: "Not characteristic of a particular person or thing.", translation: "Adj. 不典型的", synAnt: "同: atypical / 反: typical", usage: "Highly untypical", example: "Such an angry outburst was untypical of his calm personality." },
    { word: "Wacky", engDef: "Funny or amusing in a slightly odd way.", translation: "Adj. 滑稽古怪的", synAnt: "同: zany / 反: serious", usage: "Wacky idea", example: "The documentary explored several wacky inventions from the 19th century." },
    { word: "Whimsical", engDef: "Playfully quaint or fanciful in an appealing way.", translation: "Adj. 異想天開的", synAnt: "同: capricious / 反: solemn", usage: "Whimsical design", example: "The whimsical design of the park appealed to both children and adults." },
    { word: "Amorphous", engDef: "Without a clearly defined shape or form.", translation: "Adj. 無定形的", synAnt: "同: shapeless / 反: structured", usage: "Amorphous blob", example: "The nebulous gas clouds appeared as an amorphous mass through the lens." },
    { word: "Heterogeneous", engDef: "Diverse in character or content; not uniform.", translation: "Adj. 異質的、雜混的", synAnt: "同: varied / 反: homogeneous", usage: "Heterogeneous group", example: "The city’s heterogeneous population brings a wide variety of cultures." },
    { word: "Disparate", engDef: "Essentially different in kind; not allowing comparison.", translation: "Adj. 迥然不同的", synAnt: "同: contrasting / 反: similar", usage: "Disparate elements", example: "She had to juggle disparate tasks, from revising math to memorizing vocab." },
    { word: "Discrete", engDef: "Individually separate and distinct.", translation: "Adj. 個別的、離散的", synAnt: "同: separate / 反: continuous", usage: "Discrete units", example: "The analysis was broken down into several discrete components." },
    { word: "Incongruous", engDef: "Not in harmony with the surroundings.", translation: "Adj. 不協調的、不適宜的", synAnt: "同: jarring / 反: appropriate", usage: "Incongruous sight", example: "A modern steel building would be incongruous in this medieval square." },
    { word: "Novel", engDef: "New or unusual in an interesting way.", translation: "Adj. 新奇的、新穎的", synAnt: "同: innovative / 反: hackneyed", usage: "Novel theory", example: "The researcher proposed a novel theory to explain solar flares." }
];

let clozeData = {
    passage: "The discovery of an exoplanet with a retrograde orbit was considered a significant [1] by astronomers. Such [2] gravitational behavior suggested a chaotic early history. While initial data appeared [3], repeated observations confirmed it was not a measurement error. This [4] finding has forced researchers to adopt more [5] theories to explain celestial mechanics.",
    blanks: ["anomaly", "aberrant", "erratic", "singular", "unorthodox"], 
    options: ["anomaly", "aberrant", "erratic", "singular", "unorthodox", "whimsical", "capricious"]
};


        // ==========================================
        // V6.0 核心引擎
        // ==========================================
        let currentIndex = 0; let currentQuizAnswer = null; let isEngToChnQuiz = true;
        let currentSpellAnswer = null; let spellScrambledLetters = []; let spellCurrentAnswer = [];
        
        let localData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { 
            starred: [], attempts: 0, correct: 0, certs: { c1: false, c2: false, c3: false },
            spelledWords: [], spellCerts: { c1: false, c2: false, c3: false }
        };
        if (!localData.certs) localData.certs = { c1: false, c2: false, c3: false };
        if (!localData.spelledWords) localData.spelledWords = [];
        if (!localData.spellCerts) localData.spellCerts = { c1: false, c2: false, c3: false };

        function speakText(type, event) {
            event.stopPropagation(); 
            let text = type === 'word' ? vocabData[currentIndex].word : vocabData[currentIndex].example;
            const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.9; window.speechSynthesis.speak(u);
        }

        function toggleStar(e) {
            e.stopPropagation(); let w = vocabData[currentIndex].word;
            if(localData.starred.includes(w)) localData.starred = localData.starred.filter(x => x !== w); else localData.starred.push(w);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(localData)); updateStarUI();
        }
        function updateStarUI() { document.getElementById('starBtn').classList.toggle('active', localData.starred.includes(vocabData[currentIndex].word)); }

        function switchTab(t) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            event.target.classList.add('active'); document.getElementById(t + '-view').classList.add('active');
            if(t==='quiz') generateQuiz(); if(t==='spell') generateSpell(); if(t==='cloze') renderCloze();
        }

        // 單詞卡
        function renderCard() {
            if(!vocabData.length) return; document.getElementById('flashcard').classList.remove('flipped');
            setTimeout(() => {
                let d = vocabData[currentIndex];
                document.getElementById('wordText').innerHTML = d.word; document.getElementById('engDefText').innerHTML = d.engDef || '';
                document.getElementById('translationText').innerHTML = d.translation; document.getElementById('synAntText').innerHTML = `<strong>同/反義：</strong> ${d.synAnt}`;
                document.getElementById('usageText').innerHTML = `<strong>用法：</strong> ${d.usage || ''}`; document.getElementById('exampleText').innerHTML = d.example;
                document.getElementById('counterText').innerHTML = `${currentIndex + 1} / ${vocabData.length}`; updateStarUI(); 
            }, 150);
        }
        function flipCard() { document.getElementById('flashcard').classList.toggle('flipped'); }
        function nextCard() { if(currentIndex < vocabData.length-1){ currentIndex++; renderCard(); } }
        function prevCard() { if(currentIndex > 0){ currentIndex--; renderCard(); } }
        function shuffleCards() { vocabData.sort(()=>Math.random()-0.5); currentIndex=0; renderCard(); }

        // 隨機測驗 (修改為 10 / 20 / 25 門檻)
        function updateMasteryUI() {
            let rate = localData.attempts===0 ? 0 : Math.round((localData.correct/localData.attempts)*100);
            let certs = (localData.certs.c1?1:0) + (localData.certs.c2?1:0) + (localData.certs.c3?1:0);
            document.getElementById('masteryText').innerHTML = `🏆 熟練度：${rate}% (${localData.correct}/${localData.attempts}) <br> 🎖️ 證書進度：${certs} / 3`;
            if(localData.attempts>=10 && rate>=90 && !localData.certs.c1) showModal('quiz', 1);
            else if(localData.attempts>=20 && rate>=90 && !localData.certs.c2) showModal('quiz', 2);
            else if(localData.attempts>=25 && rate>=95 && !localData.certs.c3) showModal('quiz', 3);
        }
        function generateQuiz() {
            if(vocabData.length<4) return; document.getElementById('quizFeedback').innerHTML = ""; 
            isEngToChnQuiz = Math.random() > 0.5;
            currentQuizAnswer = vocabData[Math.floor(Math.random() * vocabData.length)];
            document.getElementById('quizHint').innerHTML = isEngToChnQuiz ? "👀 請選出中文：" : "🧠 請選出英文：";
            document.getElementById('quizDesc').innerHTML = isEngToChnQuiz ? currentQuizAnswer.word : currentQuizAnswer.translation;
            let ops = [currentQuizAnswer], others = vocabData.filter(v=>v.word!==currentQuizAnswer.word).sort(()=>Math.random()-0.5);
            ops.push(others[0], others[1], others[2]); ops.sort(()=>Math.random()-0.5);
            document.getElementById('quizOptions').innerHTML = ops.map(opt => `<button class="quiz-option" onclick="checkQuiz('${opt.word}')">${isEngToChnQuiz ? opt.translation : opt.word}</button>`).join('');
            updateMasteryUI();
        }
        function checkQuiz(w) {
            let fb = document.getElementById('quizFeedback'); localData.attempts++;
            if(w === currentQuizAnswer.word){ fb.innerHTML = "✅ 正確！"; fb.style.color = "green"; localData.correct++; }
            else{ fb.innerHTML = `❌ 錯誤！正解是：${isEngToChnQuiz ? currentQuizAnswer.translation : currentQuizAnswer.word}`; fb.style.color = "red"; }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(localData)); updateMasteryUI();
        }

        // 拼圖 (修改為 10 / 20 / 25 門檻)
        function updateSpellUI() {
            let uc = localData.spelledWords.length, total = vocabData.length;
            document.getElementById('spellProgressText').innerHTML = `⌨️ 詞彙收集：${uc} / ${total}`;
            document.getElementById('spellProgressBar').style.width = Math.round((uc/total)*100) + '%';
            if(uc>=10 && !localData.spellCerts.c1) showModal('spell', 1);
            else if(uc>=20 && !localData.spellCerts.c2) showModal('spell', 2);
            else if(uc>=25 && !localData.spellCerts.c3) showModal('spell', 3);
        }
        function generateSpell() {
            document.getElementById('spellFeedback').innerHTML = ""; document.getElementById('nextSpellBtn').style.display = "none";
            document.getElementById('submitSpellBtn').style.display = "inline-block"; document.getElementById('spellAnswerBox').style.display = "flex";
            document.getElementById('letterPool').style.display = "flex"; updateSpellUI();
            if(localData.spelledWords.length >= vocabData.length){
                document.getElementById('spellPrompt').innerHTML = "🎉 挑戰成功！全部生字收集完畢！";
                document.getElementById('spellAnswerBox').style.display = "none"; document.getElementById('letterPool').style.display = "none"; document.getElementById('submitSpellBtn').style.display = "none"; return;
            }
            currentSpellAnswer = vocabData[Math.floor(Math.random() * vocabData.length)];
            let chars = currentSpellAnswer.word.toLowerCase().split('').sort(()=>Math.random()-0.5);
            spellScrambledLetters = chars.map((c, i) => ({ id: i, char: c, used: false })); spellCurrentAnswer = [];
            let blanks = currentSpellAnswer.word.replace(/[a-zA-Z]/g, "_ ");
            document.getElementById('spellPrompt').innerHTML = `<strong>${currentSpellAnswer.translation}</strong><br><em>${currentSpellAnswer.example.replace(new RegExp(currentSpellAnswer.word,"gi"), blanks.trim())}</em>`;
            renderSpellGame();
        }
        function renderSpellGame() {
            let ab = document.getElementById('spellAnswerBox'), lp = document.getElementById('letterPool'); ab.innerHTML = ''; lp.innerHTML = '';
            spellCurrentAnswer.forEach((item, i) => {
                let btn = document.createElement('button'); btn.className = 'letter-tile in-answer'; btn.innerText = item.char;
                btn.onclick = () => { spellCurrentAnswer.splice(i, 1); item.used = false; renderSpellGame(); }; ab.appendChild(btn);
            });
            spellScrambledLetters.forEach(item => {
                if(!item.used){
                    let btn = document.createElement('button'); btn.className = 'letter-tile'; btn.innerText = item.char;
                    btn.onclick = () => { item.used = true; spellCurrentAnswer.push(item); renderSpellGame(); }; lp.appendChild(btn);
                }
            });
        }
        function checkSpell() {
            let ans = spellCurrentAnswer.map(i=>i.char).join(''), corr = currentSpellAnswer.word.toLowerCase(), fb = document.getElementById('spellFeedback');
            if(ans === corr){
                fb.innerHTML = "✅ 拼字正確！"; fb.style.color = "green"; 
                if(!localData.spelledWords.includes(currentSpellAnswer.word)){ localData.spelledWords.push(currentSpellAnswer.word); localStorage.setItem(STORAGE_KEY, JSON.stringify(localData)); updateSpellUI(); }
            } else { fb.innerHTML = `❌ 錯誤！正解：${currentSpellAnswer.word}`; fb.style.color = "red"; }
            document.getElementById('nextSpellBtn').style.display = "inline-block"; document.getElementById('submitSpellBtn').style.display = "none";
        }

        // 克漏字
        function renderCloze() {
            let c = document.getElementById('clozeContainer'), h = clozeData.passage; document.getElementById('clozeFeedback').innerHTML = "";
            let opts = `<option value="">-- 選擇 --</option>` + clozeData.options.map(o=>`<option value="${o}">${o}</option>`).join('');
            for(let i=0; i<clozeData.blanks.length; i++) h = h.replace(`[${i+1}]`, `<select id="clz${i}" class="cloze-select">${opts}</select>`);
            c.innerHTML = h;
        }
        function checkCloze() {
            let cor = 0;
            for(let i=0; i<clozeData.blanks.length; i++){
                let sel = document.getElementById(`clz${i}`);
                if(sel.value === clozeData.blanks[i]){ cor++; sel.style.borderColor="green"; sel.style.backgroundColor="#e8f5e9"; }
                else{ sel.style.borderColor="red"; sel.style.backgroundColor="#ffebee"; }
            }
            let fb = document.getElementById('clozeFeedback');
            if(cor === clozeData.blanks.length){ fb.innerHTML="🎉 太棒了！段落完全正確！"; fb.style.color="green"; }
            else{ fb.innerHTML=`💪 答對了 ${cor}/${clozeData.blanks.length} 個！`; fb.style.color="red"; }
        }

        // 彈窗
        function showModal(type, level) {
            let t = document.getElementById('gradTitle'), d = document.getElementById('gradDesc');
            if(type==='quiz'){
                if(level===1) { t.innerHTML="🥉 青銅證書"; d.innerHTML="選擇題完成 10 題且維持高正確率！"; }
                if(level===2) { t.innerHTML="🥈 白銀證書"; d.innerHTML="選擇題完成 20 題，太神了！"; }
                if(level===3) { t.innerHTML="🏆 黃金結業！"; d.innerHTML="選擇題刷滿 25 題且正確率 95%！"; }
            } else {
                if(level===1) { t.innerHTML="🧩 初級拼圖學者"; d.innerHTML="成功拼出 10 個生字！"; }
                if(level===2) { t.innerHTML="🧩 進階拼圖達人"; d.innerHTML="征服 20 個生字，只差一點了！"; }
                if(level===3) { t.innerHTML="👑 拼圖大師！"; d.innerHTML="滿分全制霸！肌肉記憶完美！"; }
            }
            document.getElementById('stayBtn').onclick = () => { closeModal(type, level); };
            document.getElementById('gradModal').style.display = 'flex';
        }
        function closeModal(type, level) {
            if(type==='quiz') localData.certs[`c${level}`] = true; else localData.spellCerts[`c${level}`] = true;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(localData)); document.getElementById('gradModal').style.display = 'none';
            if(type==='quiz') updateMasteryUI(); else updateSpellUI();
        }

        window.onload = () => { renderCard(); updateMasteryUI(); updateSpellUI(); };
    </script>
</body>
</html>
