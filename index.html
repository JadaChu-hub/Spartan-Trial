<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spartan Prep Vocab - 斯巴達字庫大廳</title>
    <script src="https://unpkg.com/opencc-js@1.0.5/dist/umd/full.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #F8F9FA; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; margin: 0; color: #333; position: relative;}
        h1 { color: #212529; font-size: 28px; margin-bottom: 5px; font-weight: 800;}
        p.subtitle { color: #6C757D; margin-bottom: 30px; font-size: 15px;}
        
        .lang-toggle-btn { position: absolute; top: 15px; right: 15px; background-color: #E8EEF2; color: #003E6B; border: 2px solid #003E6B; padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 2px 5px rgba(0,0,0,0.1);}
        .lang-toggle-btn:hover { background-color: #003E6B; color: white; }

        .menu-container { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 400px; }
        
        .category-btn { width: 100%; padding: 20px; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; text-align: left; cursor: pointer; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.08);}
        .category-btn:active { transform: scale(0.98); }
        .category-btn::after { content: '▼'; font-size: 14px; opacity: 0.7;}
        .category-btn.active::after { content: '▲'; }

        /* 五大色系 */
        .btn-toefl { background-color: #800000; color: white; } 
        .btn-gre { background-color: #F57F17; color: white; }   
        .btn-ielts { background-color: #6A1B9A; color: white; } 
        .btn-ap { background-color: #1565C0; color: white; }    
        .btn-tcm { background-color: #2E7D32; color: white; }   

        .unit-list { display: none; flex-direction: column; gap: 8px; padding: 15px 10px; background: white; border-radius: 10px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.05); margin-top: -5px; margin-bottom: 10px;}
        .unit-list.active { display: flex; }

        .unit-btn { width: 100%; padding: 12px 15px; background-color: white; border: 1px solid #E9ECEF; border-radius: 8px; text-decoration: none; color: #495057; font-size: 15px; font-weight: 600; cursor: pointer; text-align: left; transition: 0.2s;}
        
        .list-toefl .unit-btn:hover { border-color: #800000; background-color: #FFF5F5; color: #800000;}
        .list-gre .unit-btn:hover { border-color: #F57F17; background-color: #FFFDE7; color: #E65100;}
        .list-ielts .unit-btn:hover { border-color: #6A1B9A; background-color: #F3E5F5; color: #6A1B9A;} 
        .list-ap .unit-btn:hover { border-color: #003E6B; background-color: #E8EEF2; color: #003E6B;}
        .list-tcm .unit-btn:hover { border-color: #2E7D32; background-color: #E8F5E9; color: #2E7D32;}

        button.locked-btn { background-color: #F8F9FA; color: #ADB5BD; border: 1px dashed #DEE2E6; }
        button.locked-btn:hover { background-color: #E9ECEF; color: #6C757D; border-color: #CED4DA; }

        .paywall-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; box-sizing: border-box; backdrop-filter: blur(3px);}
        .paywall-box { background: white; padding: 30px 20px; border-radius: 20px; max-width: 320px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.3);}
        .paywall-icon { font-size: 50px; margin-bottom: 10px; }
        .paywall-title { color: #333; font-size: 22px; margin-bottom: 15px; font-weight: bold;}
        .paywall-desc { color: #666; font-size: 15px; line-height: 1.6; margin-bottom: 25px;}
        .buy-btn { width: 100%; background-color: #003E6B; color: white; font-size: 16px; font-weight: bold; padding: 15px; border: none; border-radius: 12px; cursor: pointer; margin-bottom: 10px; transition: 0.2s;}
        .cancel-btn { width: 100%; background-color: transparent; color: #888; font-size: 15px; padding: 10px; border: none; cursor: pointer; text-decoration: underline;}
    </style>
</head>
<body>

    <button class="lang-toggle-btn" onclick="toggleLanguage()">繁 / 简</button>

    <h1>🏛️ Spartan Vocab</h1>
    <p class="subtitle">選擇你要挑戰的專業領域</p>

    <div class="menu-container">
        
        <button class="category-btn btn-ap" onclick="toggleMenu('ap')">📘 AP</button>
        <div class="unit-list list-ap" id="menu-ap">
            <a href="ap_unit1.html" class="unit-btn">▶ 單元 1：谴责剥夺与哲理思辨 (開放)</a>
            <button class="unit-btn locked-btn" onclick="showPaywall()">🔒 單元 2：(建構中...)</button>
            <button class="unit-btn locked-btn" onclick="showPaywall()">🔒 單元 3 ~ 20 (完整版解鎖)</button>
        </div>

        <button class="category-btn btn-toefl" onclick="toggleMenu('toefl')">📕 TOEFL</button>
        <div class="unit-list list-toefl" id="menu-toefl">
            <a href="toefl_unit1.html" class="unit-btn">▶ 單元 1：学术研究与逻辑推理 (開放)</a>
            <a href="toefl_unit2.html" class="unit-btn">▶ 單元 2：自然环境与地球科学 (開放)</a>
            <button class="unit-btn locked-btn" onclick="showPaywall()">🔒 單元 3：人类社会，文化与歴史</button>
            <button class="unit-btn locked-btn" onclick="showPaywall()">🔒 單元 4 ~ 20 (完整版解鎖)</button>
        </div>

        <button class="category-btn btn-ielts" onclick="toggleMenu('ielts')">📓 IELTS </button>
        <div class="unit-list list-ielts" id="menu-ielts">
            <a href="ielts_unit1.html" class="unit-btn">▶ 單元 1：教育与社会议题 (開放)</a>
            <a href="ielts_unit2.html" class="unit-btn">▶ 單元 2：科技与未来发展 (開放)</a>
            <button class="unit-btn locked-btn" onclick="showPaywall()">🔒 單元 3：环境保育与生态</button>
            <button class="unit-btn locked-btn" onclick="showPaywall()">🔒 單元 4 ~ 20 (完整版解鎖)</button>
        </div>

        <button class="category-btn btn-gre" onclick="toggleMenu('gre')">📒 GRE</button>
        <div class="unit-list list-gre" id="menu-gre">
            <a href="gre_unit1.html" class="unit-btn">▶ 單元 1：知识论与学术话语 (開放)</a>
            <a href="gre_unit2.html" class="unit-btn">▶ 單元 2：修辞，传播与语言密度 (開放)</a>
            <button class="unit-btn locked-btn" onclick="showPaywall()">🔒 單元 3：性格特质与社会倾向</button>
            <button class="unit-btn locked-btn" onclick="showPaywall()">🔒 單元 4 ~ 20 (完整版解鎖)</button>
        </div>

        <button class="category-btn btn-tcm" onclick="toggleMenu('tcm')">🌿 TCM</button>
        <div class="unit-list list-tcm" id="menu-tcm">
            <button class="unit-btn locked-btn" onclick="showPaywall()">🔒 單元 1：經絡與基礎理論 (即將推出)</button>
            <button class="unit-btn locked-btn" onclick="showPaywall()">🔒 單元 2：(建構中...)</button>
        </div>   
        
    </div>

    <div class="paywall-modal" id="paywallModal">
        <div class="paywall-box">
            <div class="paywall-icon">💎</div>
            <div class="paywall-title">進階學術特訓已上鎖</div>
            <div class="paywall-desc">
                獲取完整版離線檔案，打造妳的私人終極字庫！<br>
                解鎖完整 <strong>高頻硬核單字庫</strong>、無盡的字母拼圖心流與實力總結測驗！
            </div>
            <button class="buy-btn" onclick="alert('請截圖此畫面並私訊作者，獲取完整版離線解鎖包！')">🛒 獲取完整版解鎖碼</button>
            <button class="cancel-btn" onclick="hidePaywall()">先刷免費版</button>
        </div>
    </div>

    <script>
        let currentLang = 'tw'; 
        function toggleLanguage() {
            let currentLang = 'tw'; 
        let converterToCn = null;
        let converterToTw = null;

        function toggleLanguage() {
            try {
                // 如果還沒初始化，就建立轉換器
                if (!converterToCn) {
                    converterToCn = OpenCC.Converter({ from: 'tw', to: 'cn' });
                    converterToTw = OpenCC.Converter({ from: 'cn', to: 'tw' });
                }
                
                const rootNode = document.body;
                if (currentLang === 'tw') {
                    OpenCC.HTML.Convert(converterToCn, rootNode);
                    currentLang = 'cn';
                } else {
                    OpenCC.HTML.Convert(converterToTw, rootNode);
                    currentLang = 'tw';
                }
            } catch (error) {
                alert("轉換引擎載入中或網路受阻，請稍後再試！\n" + error);
                console.error(error);
            }
        }
        function toggleMenu(menuId) {
            document.querySelectorAll('.unit-list').forEach(list => list.classList.remove('active'));
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            const targetList = document.getElementById('menu-' + menuId);
            const targetBtn = document.querySelector('.btn-' + menuId);
            if (targetList.style.display !== 'flex') {
                document.querySelectorAll('.unit-list').forEach(list => list.style.display = 'none'); 
                targetList.style.display = 'flex';
                targetBtn.classList.add('active');
            } else {
                targetList.style.display = 'none';
            }
        }
        function showPaywall() { document.getElementById('paywallModal').style.display = 'flex'; }
        function hidePaywall() { document.getElementById('paywallModal').style.display = 'none'; }
    </script>
</body>

</html>
