<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spartan Prep Vocab - 英文字庫中心</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; margin: 0; color: #333; }
        h1 { color: #2c3e50; font-size: 28px; margin-bottom: 10px; }
        p.subtitle { color: #7f8c8d; margin-bottom: 30px; }
        
        .menu-container { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 400px; }
        
        /* 托福 區塊 (暗紅) */
        .section-toefl { background-color: #FFF5F5; border-left: 6px solid #800000; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .section-toefl h2 { color: #800000; margin-top: 0; font-size: 20px; }

        /* GRE 區塊 (鵝黃) */
        .section-gre { background-color: #FFFDE7; border-left: 6px solid #F57F17; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .section-gre h2 { color: #E65100; margin-top: 0; font-size: 20px; }

        /* 中醫針灸 區塊 (護眼綠) */
        .section-tcm { background-color: #E8F5E9; border-left: 6px solid #2E7D32; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .section-tcm h2 { color: #2E7D32; margin-top: 0; font-size: 20px; }

        /* 按鈕共用樣式 */
        .unit-btn { display: block; width: 100%; padding: 12px 15px; margin-bottom: 10px; background-color: white; border: 1px solid #ddd; border-radius: 8px; text-decoration: none; color: #333; font-weight: bold; transition: 0.2s; box-sizing: border-box; text-align: left; font-size: 15px; cursor: pointer; }
        
        /* 開放試用按鈕 Hover 變色效果 */
        .section-toefl a.unit-btn:hover { background-color: #FADBD8; border-color: #800000; }
        .section-gre a.unit-btn:hover { background-color: #FFF59D; border-color: #F57F17; }
        .section-tcm a.unit-btn:hover { background-color: #C8E6C9; border-color: #2E7D32; }

        /* 🔒 上鎖按鈕樣式 */
        button.locked-btn { background-color: #f0f0f0; color: #888; border: 1px dashed #ccc; }
        button.locked-btn:hover { background-color: #e8e8e8; }

        /* ======= 付費解鎖彈窗 (Paywall) ======= */
        .paywall-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; box-sizing: border-box; backdrop-filter: blur(3px);}
        .paywall-box { background: white; padding: 30px 20px; border-radius: 20px; max-width: 320px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.3);}
        .paywall-icon { font-size: 50px; margin-bottom: 10px; }
        .paywall-title { color: #333; font-size: 22px; margin-bottom: 15px; font-weight: bold;}
        .paywall-desc { color: #666; font-size: 15px; line-height: 1.6; margin-bottom: 25px;}
        
        .buy-btn { width: 100%; background-color: #E65100; color: white; font-size: 16px; font-weight: bold; padding: 15px; border: none; border-radius: 12px; cursor: pointer; margin-bottom: 10px; transition: 0.2s;}
        .buy-btn:hover { background-color: #BF360C; }
        .cancel-btn { width: 100%; background-color: transparent; color: #888; font-size: 15px; padding: 10px; border: none; cursor: pointer; text-decoration: underline;}
    </style>
</head>
<body>

    <h1>📚 Spartan Prep Vocab</h1>

    <div class="menu-container">

            <button class="unit-btn locked-btn" onclick="showPaywall('GRE')">🔒 單元 3：性格特质，社会倾向与人际动态</button>

    <div class="paywall-modal" id="paywallModal">

    <script>
        function showPaywall(courseName) {
            document.getElementById('paywallModal').style.display = 'flex';
        }

            document.getElementById('paywallModal').style.display = 'none';
        }

</body>
</html>
