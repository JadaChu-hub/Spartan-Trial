<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEFL 深度學習 (單元 2)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #FDF5E6; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; color: #333; padding-top: 20px; }
        h1 { color: #800000; margin-bottom: 15px; font-size: 24px; text-align: center;}
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center;}
        .tab-btn { padding: 10px 15px; font-size: 16px; border: none; border-radius: 8px; background-color: #F5D0D0; color: #800000; cursor: pointer; font-weight: bold; transition: 0.3s;}
        .tab-btn.active { background-color: #800000; color: white; }
        .view-section { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 380px; }
        .view-section.active { display: flex; }
        .card-container { width: 90vw; max-width: 350px; height: 320px; perspective: 1000px; margin-bottom: 20px; cursor: pointer; }
        .card { width: 100%; height: 100%; position: relative; transition: transform 0.6s; transform-style: preserve-3d; box-shadow: 0 10px 20px rgba(0,0,0,0.1); border-radius: 15px; }
        .card.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 15px; padding: 25px; box-sizing: border-box; text-align: center; }
        .card-front { background-color: #ffffff; color: #800000; font-size: 32px; font-weight: bold; border: 2px solid #E6B8B8; backface-visibility: hidden; position: relative;}
        .card-back { background-color: #FFF5F5; color: #4A1515; transform: rotateY(180deg); align-items: flex-start; text-align: left; overflow-y: auto; backface-visibility: hidden; }
        .translation { font-size: 18px; font-weight: bold; margin-bottom: 10px; color: #800000; border-bottom: 1px solid #E6B8B8; padding-bottom: 5px; width: 100%;}
        .details { font-size: 14px; margin-bottom: 8px; line-height: 1.4; }
        .details strong { color: #B22222; }
        .example { font-size: 14px; font-style: italic; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #D9A8A8; color: #5C2C2C; }
        .front-tools { display: flex; gap: 20px; margin-top: 15px; align-items: center;}
        .tool-btn { background: none; border: none; font-size: 28px; cursor: pointer; padding: 0; outline: none; transition: 0.2s;}
        .star-btn { color: #ccc; }
        .star-btn.active { color: #FFD700; transform: scale(1.2); }
        .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        button.action-btn { padding: 10px 15px; font-size: 15px; border: none; border-radius: 8px; background-color: #800000; color: white; cursor: pointer; }
        button.action-btn:hover { background-color: #600000; }
        .counter { margin-top: 15px; font-size: 14px; color: #800000; }
        .mastery-text { font-size: 15px; color: #800000; font-weight: bold; margin-bottom: 15px; background: #F5D0D0; padding: 10px 15px; border-radius: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; line-height: 1.6; width: 90%;}
        .quiz-question { font-size: 18px; font-weight: bold; color: #800000; text-align: center; margin-bottom: 20px; padding: 0 15px; line-height: 1.5;}
        .quiz-options { width: 100%; display: flex; flex-direction: column; gap: 10px; padding: 0 20px; box-sizing: border-box;}
        .quiz-option { padding: 15px; background-color: #ffffff; color: #800000; border: 2px solid #800000; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; text-align: center; transition: 0.2s; }
        .quiz-option:hover { background-color: #FFF5F5; }
        .feedback { margin-top: 15px; font-weight: bold; font-size: 18px; min-height: 24px; text-align: center;}
        .spell-prompt { font-size: 16px; color: #4A1515; text-align: center; margin-bottom: 15px; padding: 0 20px;}
        .spell-input { padding: 12px; font-size: 20px; width: 80%; border: 2px solid #800000; border-radius: 8px; margin-bottom: 15px; text-align: center; outline: none;}

        .grad-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; box-sizing: border-box;}

        .grad-desc { color: white; font-size: 16px; line-height: 1.6; margin-bottom: 30px;}
        .btn-box { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 280px; align-items: center; }
        .grad-btn { width: 100%; background-color: #FFD700; color: #333; font-size: 16px; font-weight: bold; padding: 15px 20px; border: none; border-radius: 30px; cursor: pointer; transition: 0.2s;}
        .grad-btn.stay-btn { background-color: #444; color: #fff; border: 1px solid #777;}
    </style>
</head>
<body>

    <h1>📕 TOEFL 斯巴達特訓 (Unit 2)</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('flashcard')">📇 單字卡</button>
        <button class="tab-btn" onclick="switchTab('quiz')">📝 選擇題</button>
        <button class="tab-btn" onclick="switchTab('spell')">⌨️ 拼字題</button>
    </div>

    <div id="flashcard-view" class="view-section active">
        <div class="card-container" onclick="flipCard()">
            <div class="card" id="flashcard">
                <div class="card-front">
                    <span id="wordText">Word</span>
                    <div class="front-tools">
                        <button class="tool-btn" onclick="speakText('word', event)">🔊</button>
                        <button class="tool-btn star-btn" id="starBtn" onclick="toggleStar(event)">★</button>
                    </div>
                </div>
                <div class="card-back">
                    <div class="translation" id="translationText">解釋</div>
                    <div class="details" id="synAntText"><strong>同/反義：</strong><span>...</span></div>
                    <div class="details" id="usageText"><strong>用法：</strong><span>...</span></div>
                    <div class="example" id="exampleText">例句...</div>
                    <button onclick="speakText('example', event)" style="margin-top: 10px; background-color: #800000; color: white; border: none; border-radius: 5px; padding: 8px 15px; font-size: 14px; cursor: pointer; align-self: center;">🔊 朗讀例句</button>
                </div>
            </div>
        </div>
        <div class="controls">
            <button class="action-btn" onclick="prevCard()">⬅️ 上一個</button>
            <button class="action-btn" onclick="flipCard()">🔄 翻面</button>
            <button class="action-btn" onclick="nextCard()">下一個 ➡️</button>
            <button class="action-btn" style="background-color: #4CAF50;" onclick="shuffleCards()">🔀 洗牌</button>
        </div>
        <div class="counter" id="counterText">1 / ?</div>
    </div>

    <div id="quiz-view" class="view-section">
        <div class="mastery-text" id="masteryText">🏆 熟練度：0% (0/0) <br> 🎖️ 斯巴達證書：0 / 3</div>
        <div class="quiz-question" id="quizQuestion">請選出符合以下解釋的單字：<br><br><span id="quizDesc">...</span></div>
        <div class="quiz-options" id="quizOptions"></div>
        <div class="feedback" id="quizFeedback"></div>
        <button class="action-btn" style="margin-top: 15px;" onclick="generateQuiz()">下一題</button>
    </div>

    <div id="spell-view" class="view-section">
        <div class="quiz-question">請根據提示拼出正確單字：</div>
        <div class="spell-prompt" id="spellPrompt">解釋與例句</div>
        <input type="text" class="spell-input" id="spellInput" placeholder="輸入英文單字..." autocomplete="off">
        <button class="action-btn" onclick="checkSpell()">送出答案</button>
        <div class="feedback" id="spellFeedback"></div>
        <button class="action-btn" style="margin-top: 15px; display: none;" id="nextSpellBtn" onclick="generateSpell()">下一題</button>
    </div>

    <div class="grad-modal" id="gradModal">
        <h2 class="grad-title" id="gradTitle">🛡️ 結業！</h2>
        <p class="grad-desc" id="gradDesc">說明文字</p>
        <div class="btn-box" id="gradBtnBox"></div>
    </div>

    <script>

        synAnt: "Lithify (v.), Hardening",
        usage: "Lithification process; Rock formation；描述沉积物变成岩石的过程",
        example: "Pressure and time lead to the lithification of loose sand into sandstone."
    },
    {
        word: "Monsoon",
        translation: "季风",
        synAnt: "Seasonal wind, Rainfall",
        usage: "Monsoon season; Summer monsoon；关于亚洲气候讨论的重点词汇",
        example: "The monsoon brings heavy rains that are vital for local agriculture."
    },
    {
        word: "Permeability",
        translation: "渗透性",
        synAnt: "Permeable (adj.), Porosity",
        usage: "Soil permeability; High permeability；物理地理学中关于流体流动的描述",
        example: "The high permeability of the gravel allowed water to drain quickly."
    },
    {
        word: "Runoff",
        translation: "径流（雨水等流过地表产生的流出量）",
        synAnt: "Drainage, Flow, Discharge",
        usage: "Urban runoff; Agricultural runoff；关于水污染和城市排水的讨论",
        example: "Agricultural runoff can carry harmful pesticides into nearby rivers."
    },
    {
        word: "Silt",
        translation: "淤泥、泥沙",
        synAnt: "Mud, Sediment, Sludge",
        usage: "River silt; Silt buildup；描述河流沉积和三角洲形成的关键词",
        example: "The river is muddy because it carries a large amount of fine silt."
    },
    {
        word: "Tributary",
        translation: "支流",
        synAnt: "Branch, Stream, Feeder",
        usage: "River tributary; Large tributary；描述水系结构的术语",
        example: "The Missouri River is the longest tributary of the Mississippi."
    }
];



        // ==========================================
        // 以下為 V4.0 核心引擎，完全不需要動！
        // ==========================================
        let currentIndex = 0; let currentQuizAnswer = null; let currentSpellAnswer = null;
        
        let localData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { 
            starred: [], attempts: 0, correct: 0, 
            certs: { c1: false, c2: false, c3: false } 
        };
        if (!localData.certs) localData.certs = { c1: false, c2: false, c3: false };

        function speakText(type, event) {
            event.stopPropagation(); 
            let textToSpeak = type === 'word' ? vocabData[currentIndex].word : vocabData[currentIndex].example.replace(/_______/g, vocabData[currentIndex].word);
            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = 'en-US'; utterance.rate = 0.9;     
            window.speechSynthesis.speak(utterance);
        }

        function updateStarUI() {
            let currentWord = vocabData[currentIndex].word;
            let starBtn = document.getElementById('starBtn');
            if(localData.starred.includes(currentWord)) {
                starBtn.classList.add('active');
            } else {
                starBtn.classList.remove('active');
            }
        }

        function toggleStar(event) {
            event.stopPropagation();
            let currentWord = vocabData[currentIndex].word;
            if(localData.starred.includes(currentWord)) {
                localData.starred = localData.starred.filter(w => w !== currentWord);
            } else {
                localData.starred.push(currentWord);
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(localData));
            updateStarUI();
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.view-section').forEach(view => view.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabName + '-view').classList.add('active');
            if(tabName === 'quiz') generateQuiz();
            if(tabName === 'spell') generateSpell();
        }

        function renderCard() {
            const cardElement = document.getElementById('flashcard');
            cardElement.classList.remove('flipped');
            setTimeout(() => {
                const data = vocabData[currentIndex];
                document.getElementById('wordText').innerHTML = data.word;
                document.getElementById('translationText').innerHTML = data.translation;
                document.getElementById('synAntText').innerHTML = `<strong>同/反義：</strong> ${data.synAnt || '無'}`;
                document.getElementById('usageText').innerHTML = `<strong>用法：</strong> ${data.usage || '無'}`;
                document.getElementById('exampleText').innerHTML = data.example;
                document.getElementById('counterText').innerHTML = `${currentIndex + 1} / ${vocabData.length}`;
                updateStarUI(); 
            }, 150);
        }
        function flipCard() { document.getElementById('flashcard').classList.toggle('flipped'); }
        function nextCard() { if (currentIndex < vocabData.length - 1) { currentIndex++; renderCard(); } }
        function prevCard() { if (currentIndex > 0) { currentIndex--; renderCard(); } }
        function shuffleCards() { vocabData.sort(() => Math.random() - 0.5); currentIndex = 0; renderCard(); alert("🔀 單字已重新洗牌！"); }

        function updateMasteryUI() {
            let rate = localData.attempts === 0 ? 0 : Math.round((localData.correct / localData.attempts) * 100);
            let certCount = 0;
            if(localData.certs.c1) certCount++;
            if(localData.certs.c2) certCount++;
            if(localData.certs.c3) certCount++;

            document.getElementById('masteryText').innerHTML = `🏆 熟練度：${rate}% (${localData.correct}/${localData.attempts}) <br> 🎖️ 斯巴達證書：${certCount} / 3`;

            if (localData.attempts >= 15 && rate >= 90 && !localData.certs.c1) showModal(1);
            else if (localData.attempts >= 30 && rate >= 90 && !localData.certs.c2) showModal(2);
            else if (localData.attempts >= 50 && rate >= 95 && !localData.certs.c3) showModal(3);
        }

        function showModal(level) {
            const modal = document.getElementById('gradModal');
            const title = document.getElementById('gradTitle');
            const desc = document.getElementById('gradDesc');
            const btnBox = document.getElementById('gradBtnBox');

            if (level === 1) {
                title.innerHTML = "🥉 獲得：青銅斯巴達";
                desc.innerHTML = "不錯嘛！妳已經完成 15 題以上且維持高正確率。<br>這是妳的第一張證書！還有兩張等著妳！";
                btnBox.innerHTML = `<button class="grad-btn" onclick="closeModal(1)">收下證書，繼續特訓</button>`;
            } else if (level === 2) {
                title.innerHTML = "🥈 獲得：白銀斯巴達";
                desc.innerHTML = "太神了！完成 30 題以上且正確率達標。<br>第二張證書入手！最後的黃金考驗就在眼前！";
                btnBox.innerHTML = `<button class="grad-btn" onclick="closeModal(2)">收下證書，繼續特訓</button>`;
            } else if (level === 3) {
                title.innerHTML = "🏆 黃金斯巴達結業！";
                desc.innerHTML = "難以置信！妳已經刷滿 50 題且正確率高達 95% 以上！<br>妳已完全征服這個單元！請選擇妳的下一步：";
                btnBox.innerHTML = `
                    <button class="grad-btn" onclick="window.location.href='index.html'">🎓 榮耀結業 (返回大廳)</button>
                    <button class="grad-btn stay-btn" onclick="closeModal(3)">📚 留下來繼續複習</button>
                `;
            }
            modal.style.display = 'flex';
        }

        function closeModal(level) {
            if (level === 1) localData.certs.c1 = true;
            if (level === 2) localData.certs.c2 = true;
            if (level === 3) localData.certs.c3 = true;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(localData));
            document.getElementById('gradModal').style.display = 'none';
            updateMasteryUI();
        }

        function generateQuiz() {
            document.getElementById('quizFeedback').innerHTML = ""; document.getElementById('quizFeedback').style.color = "";
            let answerIndex = Math.floor(Math.random() * vocabData.length); currentQuizAnswer = vocabData[answerIndex];
            document.getElementById('quizDesc').innerHTML = currentQuizAnswer.translation;
            let options = [currentQuizAnswer]; let others = vocabData.filter(v => v.word !== currentQuizAnswer.word);
            others.sort(() => Math.random() - 0.5); options.push(others[0] || currentQuizAnswer, others[1] || currentQuizAnswer, others[2] || currentQuizAnswer);
            options.sort(() => Math.random() - 0.5);
            let optionsHtml = ""; options.forEach(opt => { optionsHtml += `<button class="quiz-option" onclick="checkQuiz('${opt.word}')">${opt.word}</button>`; });
            document.getElementById('quizOptions').innerHTML = optionsHtml;
            updateMasteryUI();
        }

        function checkQuiz(selectedWord) {
            let feedback = document.getElementById('quizFeedback');
            localData.attempts++; 
            if (selectedWord === currentQuizAnswer.word) { 
                feedback.innerHTML = "✅ 答對了！"; feedback.style.color = "green"; localData.correct++; 
            } else { 
                feedback.innerHTML = `❌ 答錯囉！正解是：${currentQuizAnswer.word}`; feedback.style.color = "red"; 
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(localData));
            updateMasteryUI();
        }

        function generateSpell() {
            document.getElementById('spellFeedback').innerHTML = ""; document.getElementById('spellInput').value = ""; document.getElementById('nextSpellBtn').style.display = "none";
            let answerIndex = Math.floor(Math.random() * vocabData.length); currentSpellAnswer = vocabData[answerIndex];
            document.getElementById('spellPrompt').innerHTML = `<strong>${currentSpellAnswer.translation}</strong><br><br><em>例句提示：${currentSpellAnswer.example.replace(new RegExp(currentSpellAnswer.word, "gi"), "_______")}</em>`;
            document.getElementById('spellInput').focus();
        }

        function checkSpell() {
            let inputWord = document.getElementById('spellInput').value.trim().toLowerCase(); let correctWord = currentSpellAnswer.word.trim().toLowerCase();
            let feedback = document.getElementById('spellFeedback');
            if (inputWord === correctWord) { feedback.innerHTML = "✅ 拼字正確！"; feedback.style.color = "green"; document.getElementById('nextSpellBtn').style.display = "inline-block"; } 
            else { feedback.innerHTML = `❌ 拼错！正解是：<strong>${currentSpellAnswer.word}</strong>`; feedback.style.color = "red"; document.getElementById('nextSpellBtn').style.display = "inline-block"; }
        }

        window.onload = () => { renderCard(); updateMasteryUI(); };
    </script>
</body>
</html>
